name: Ruby

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ruby:
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
        include:
          - os: ubuntu-latest
            ruby: head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0"
          bundler: default
          bundler-cache: true
      - name: Run lint checks
        run: bundle exec rake lint
      - name: Enforce coverage floor
        run: COVERAGE=1 COVERAGE_MIN=85 bundle exec rake test

  prism-lower-bound:
    runs-on: ubuntu-latest
    env:
      PRISM_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "3.1"
          bundler: default
      - name: Install dependencies with minimum Prism
        run: bundle install
      - name: Run tests with minimum Prism
        run: |
          bundle exec ruby -Itest -Ilib -e '
            expected = ENV.fetch("PRISM_VERSION")
            actual = Gem.loaded_specs.fetch("prism").version.to_s
            abort "expected Prism #{expected}, got #{actual}" unless actual == expected
            Dir["test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }
          '

  shader-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0"
          bundler: default
          bundler-cache: true
      - name: Install GLSL validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Install WGSL validator
        run: cargo install --git https://github.com/gfx-rs/wgpu --tag v29.0.3 naga-cli --locked
      - name: Compile generated shaders
        run: REQUIRE_GLSL_COMPILER=1 REQUIRE_WGSL_COMPILER=1 bundle exec ruby -Itest test/rlsl/target_compilation_test.rb

  metal-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: "4.0"
          bundler: default
          bundler-cache: true
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent metalToolchain
      - name: Compile generated MSL
        run: REQUIRE_MSL_COMPILER=1 bundle exec ruby -Itest test/rlsl/target_compilation_test.rb

  package:
    name: Strict gem build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '4.0'
          bundler: default
      - name: Build with strict gem validation
        run: gem build --strict "$(find . -maxdepth 1 -name '*.gemspec' -print -quit)"
